event_sources:
# Luma Zurich — tech/AI/startup events (JS-rendered, requires Playwright)
- url: https://lu.ma/zurich
  type: playwright
  location_filter: ''
# Meetup — the most reliable aggregator. Keywords are chosen to avoid the
# wellness sense of "energy" (a bare energy/sustainability search returns
# aura readings and yoga); the AI/ML/data terms stay on-profile.
- url: https://www.meetup.com/find/?keywords=artificial+intelligence&location=ch--zurich&source=EVENTS
  location_filter: ''
- url: https://www.meetup.com/find/?keywords=machine+learning&location=ch--zurich&source=EVENTS
  location_filter: ''
- url: https://www.meetup.com/find/?keywords=data+science&location=ch--zurich&source=EVENTS
  location_filter: ''
# Eventbrite — Zurich area
- url: https://www.eventbrite.com/d/switzerland--zurich/artificial-intelligence/
  location_filter: ''
- url: https://www.eventbrite.com/d/switzerland--zurich/energy-technology/
  location_filter: ''
- url: https://www.eventbrite.com/d/switzerland--zurich/science-and-tech--events/
  location_filter: ''
# ETH Zurich public event calendar (JSON API behind the ethz.ch event pages).
# Filtered by fetch_eth_events to talks and conferences — seminars, colloquia,
# congresses, public lectures — over the next 60 days.
- url: 'https://idapps.ethz.ch/pcm-pub-services/v2/entries?rs-first=0&rs-size=400&filters[0].min-till-end=0&filters[0].max-till-start=60&filters[0].cals=1&lang=en&client-id=wcms&comp-ext=true'
  type: eth_api
  location_filter: ''
# IAEE — energy-economics conferences (low volume, high relevance)
- url: https://iaee.org/events
  type: html
  location_filter: ''
