# PersonalMentor — Content Sources
#
# Every source below was verified live on 2026-08-29: it returns items, and
# those items survive the profile relevance filter. Prefer real RSS over
# `type: html` scraping — HTML scrapes return no publication date, which
# degrades day-over-day novelty ranking (see prioritize_unseen in
# render_newspaper.py) and tends to pick up site navigation as "articles".

rss_feeds:
# --- AI labs & research ---
- url: https://www.technologyreview.com/topic/artificial-intelligence/feed/
  category: ai
- url: https://venturebeat.com/category/ai/feed/
  category: ai
- url: https://openai.com/news/rss.xml
  category: ai
- url: https://deepmind.google/blog/rss.xml
  category: ai
- url: https://research.google/blog/rss/
  category: ai
- url: https://spectrum.ieee.org/feeds/topic/artificial-intelligence.rss
  category: ai
# Import AI — Jack Clark's weekly analysis newsletter
- url: https://jack-clark.net/feed/
  category: ai
# --- Energy: markets, grid, storage ---
- url: https://spectrum.ieee.org/feeds/topic/energy.rss
  category: energy
- url: https://www.canarymedia.com/articles.rss
  category: energy
# ENTSO-E — real RSS feed (the /news/ HTML page scrapes as navigation)
- url: https://www.entsoe.eu/rss/news.xml
  category: energy
# Energy Monitor — the feed works even though the /news/ page returns 403
- url: https://www.energymonitor.ai/feed/
  category: energy
# Latitude Media — energy x AI x data centres, the exact profile intersection
- url: https://www.latitudemedia.com/feed
  category: energy
- url: https://www.energy-storage.news/feed/
  category: energy
- url: https://www.utilitydive.com/feeds/news/
  category: energy
- url: https://www.powermag.com/feed/
  category: energy
# Montel — best power-market coverage available; no RSS, HTML scrape is clean
- url: https://www.montelnews.com/
  category: energy
  type: html
# --- Big-tech strategy & management (MTEC / strategy lane) ---
- url: https://stratechery.com/feed/
  category: tech
- url: https://www.mckinsey.com/insights/rss
  category: tech
# --- ETH Zurich ---
# ETH's AEM feeds (the `_jcr_content.feed.html` suffix) — real RSS with dated
# entries, unlike the news/event *pages*, which scrape as site navigation.
# Left as `category: news` so classify_topic routes each story to the energy or
# AI track on its own keywords rather than forcing the whole feed into one.
- url: https://www.ethz.ch/en/news-and-events/eth-news/news/_jcr_content.feed.html
  category: news
- url: https://ai.ethz.ch/news-and-events/ai-center-news/_jcr_content.feed.html
  category: ai
# --- Broad tech (profile relevance filter trims off-profile items) ---
- url: https://hnrss.org/frontpage
  category: tech
- url: https://techcrunch.com/feed/
  category: tech

